function useLocalStorage(key, init) {
  const [val, setVal] = useState(() => { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; } catch { return init; } });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }, [key, val]);
  return [val, setVal];
}

async function callAI(messages) {
  try {
    const encoded = encodeURIComponent(JSON.stringify(messages));
    const res = await fetch(`https://text.pollinations.ai/${encoded}`);
    return await res.text();
  } catch { return null; }
}

function Toast({ msg }) { return <div className={`toast ${msg?'show':''}`}>{msg||' '}</div>; }
function Chip({ label, active, onClick }) { return <button className={`chip ${active?'active':''}`} onClick={onClick}>{label}</button>; }

// ── 打卡 ──
function CheckinCard() {
  const today = new Date().toISOString().slice(0,10);
  const [data, setData] = useLocalStorage('checkin-data', { streak:0, lastDate:'', history:[] });
  const alreadyDone = data.lastDate === today;
  const last7 = Array.from({length:7},(_,i)=>{ const d=new Date(); d.setDate(d.getDate()-6+i); return d.toISOString().slice(0,10); });
  const doCheckin = () => {
    if (alreadyDone) return;
    const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
    const yStr = yesterday.toISOString().slice(0,10);
    const newStreak = data.lastDate === yStr ? data.streak+1 : 1;
    setData({ streak:newStreak, lastDate:today, history:[...data.history, today] });
  };
  return (
    <div className="checkin-card">
      <div className="checkin-title">📸 每日限時動態打卡</div>
      <div className="checkin-desc">堅持每天發限時動態，養成自媒體發文習慣！</div>
      <div className="checkin-streak"><span className="streak-num">{data.streak}</span><span className="streak-label">天連續打卡 🔥</span></div>
      <div className="checkin-dots">
        {last7.map(d=><div key={d} className={`dot ${data.history.includes(d)?'done':''}`}>{data.history.includes(d)?'✓':''}</div>)}
        <span style={{fontSize:'11px',color:'#C4B5FD',alignSelf:'center',marginLeft:4}}>過去7天</span>
      </div>
      <button className="btn-checkin" onClick={doCheckin} disabled={alreadyDone}>{alreadyDone?'✅ 今天已打卡！':'立即打卡 ✨'}</button>
    </div>
  );
}

function AIPanel({ onClose }) {

  const [loading, setLoading] = useState(false);
  const bottomRef = useRef(null);

  const send = async () => {
    if (!input.trim()||loading) return;
    const userMsg = input.trim(); setInput(''); setLoading(true);
    setMsgs(m=>[...m,{role:'user',text:userMsg}]);
    const history = msgs.map(m=>({role:m.role==='user'?'user':'assistant',content:m.text}));

function PracticePage() {
  const [selected, setSelected] = useState(null);
  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [started, setStarted] = useState(false);
  const bottomRef = useRef(null);
  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:'smooth'}); },[msgs]);

  const startScenario = async (s) => {
    setSelected(s); setStarted(true); setMsgs([]); setLoading(true);
    const initMsgs = [{role:'system',content:`${s.prompt} 只扮演客人，不要解釋自己在做什麼。用繁體中文、台灣口語對話。`},{role:'user',content:'開始'}];
    const reply = await callAI(initMsgs);
    setMsgs([{role:'ai',text:reply||'你好！'}]);
    setLoading(false);
  };

  const send = async () => {
    if (!input.trim()||loading||!selected) return;
    const userMsg = input.trim(); setInput(''); setLoading(true);
    const newMsgs = [...msgs,{role:'user',text:userMsg}];
    setMsgs(newMsgs);
    const history = newMsgs.map(m=>({role:m.role==='user'?'user':'assistant',content:m.text}));
    const allMsgs = [{role:'system',content:`${selected.prompt} 只扮演客人，繼續對話，用繁體中文台灣口語。對方說得好就稍微鬆動，說得不好就繼續抗拒。`},...history];
    const reply = await callAI(allMsgs);
    setMsgs(m=>[...m,{role:'ai',text:reply||'嗯⋯'}]);
    setLoading(false);
  };

  const getFeedback = async () => {
    if (msgs.length < 2) return;
    setLoading(true);
    const conv = msgs.map(m=>`${m.role==='user'?'銷售員':'客人'}：${m.text}`).join('\n');
    const allMsgs = [{role:'system',content:'你是銷售培訓教練，用繁體中文給出具體、鼓勵性的回饋。'},{role:'user',content:`請分析這段銷售對話，給出優點和改進建議：\n${conv}`}];
    const reply = await callAI(allMsgs);
    setMsgs(m=>[...m,{role:'ai',text:`📊 教練點評：\n${reply||'繼續加油！'}`}]);
    setLoading(false);
  };

  const reset = () => { setSelected(null); setMsgs([]); setStarted(false); setInput(''); };
  const onKey = e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} };

  return (
    <div className="practice-page">
      <div className="practice-hero">
        <h2>💬 銷售話術 AI 演練</h2>
        <p>選擇客人類型，跟 AI 客人實際對話練習！練完可以請 AI 教練給你回饋。</p>
      </div>

      <div className="tip-card">💡 練習方式：選一種情境 → 跟 AI 客人對話 → 點「教練點評」看改進建議</div>

      <div className="scenario-grid">
        {SCENARIOS.map(s=>(
          <button key={s.id} className={`scenario-btn ${selected?.id===s.id?'selected':''}`} onClick={()=>startScenario(s)}>
            <span className="scenario-icon">{s.icon}</span>
            <span className="scenario-label">{s.label}</span>
          </button>
        ))}
      </div>

      {started && (
        <div className="practice-chat">
          <div className="practice-chat-header">
            <div className="practice-chat-title">{selected?.icon} {selected?.label} 情境演練</div>
            <div style={{display:'flex',gap:8}}>
              <button className="btn-reset" onClick={getFeedback} disabled={loading||msgs.length<2}>📊 教練點評</button>
              <button className="btn-reset" onClick={reset}>重選</button>
            </div>
          </div>
          <div className="practice-messages">
            <div className="pmsg ai">我是你的 AI 客人，開始練習吧！你先開口 👇</div>
            {msgs.map((m,i)=><div key={i} className={`pmsg ${m.role}`} style={{whiteSpace:'pre-line'}}>{m.text}</div>)}

          <div className="practice-input-row">
            <textarea className="practice-input" value={input} rows={1} onChange={e=>setInput(e.target.value)} onKeyDown={onKey} placeholder="輸入你的銷售話術..."/>
            <button className="practice-send" onClick={send} disabled={!input.trim()||loading}>➤</button>
          </div>
        </div>
      )}

  useEffect(()=>{ if(window.__db){setFbReady(true);return;} const h=()=>setFbReady(true); window.addEventListener('firebase-ready',h); return()=>window.removeEventListener('firebase-ready',h); },[]);
  useEffect(()=>{
    if(!fbReady) return;
    const {collection,onSnapshot,query,orderBy}=window.__firebase;
    const q=query(collection(window.__db,'resources'),orderBy('createdAt','desc'));
    const unsub=onSnapshot(q,snap=>{setResources(snap.docs.map(d=>({id:d.id,...d.data()})));},()=>{});
    return unsub;
  },[fbReady]);

  const showToast = useCallback(msg=>{ setToast(msg); setTimeout(()=>setToast(""),2000); },[]);
  const filtered = useMemo(()=>resources.filter(r=>{
    if(category!=="全部"&&r.category!==category) return false;
    if(showSaved&&!r.saved) return false;
    if(activeTag&&!r.tags?.includes(activeTag)) return false;
    if(search&&!r.title?.includes(search)&&!r.desc?.includes(search)) return false;
    return true;
  }),[resources,category,search,activeTag,showSaved]);

  const handleLike = id=>{ const r=resources.find(r=>r.id===id); if(!r) return; const {doc,updateDoc}=window.__firebase; updateDoc(doc(window.__db,'resources',id),{liked:!r.liked,likes:r.liked?r.likes-1:r.likes+1}); };
  const handleSave = id=>{ const r=resources.find(r=>r.id===id); if(!r) return; const {doc,updateDoc}=window.__firebase; updateDoc(doc(window.__db,'resources',id),{saved:!r.saved}); showToast(r.saved?'已取消收藏':'已加入收藏 ★'); };
  const handleEdit = r=>{ setEditTarget(r); setModalOpen(true); };
  const handleSaveResource = form=>{ const {collection,addDoc,doc,updateDoc,serverTimestamp}=window.__firebase; if(editTarget){updateDoc(doc(window.__db,'resources',editTarget.id),{...form});showToast('已更新 ✓');}else{addDoc(collection(window.__db,'resources'),{...form,author:'You',avatar:'Y',likes:0,saved:false,liked:false,date:new Date().toISOString().slice(0,10),type:form.type||'link',createdAt:serverTimestamp()});showToast('已新增資源 ✓');} };

  const showCheckin = category==="全部"||category==="限時動態打卡";

  return (
    <>
      {/* Header — 只在 home 頁顯示 */}
      {page==='home'&&(
        <header className="header">
          <div className="header-inner">
            <div className="header-top">
              <div className="header-title"><h1>Million 陪跑班</h1><p>{resources.length} 個資源 · {resources.filter(r=>r.saved).length} 個收藏</p></div>
              <button className="btn-add" onClick={()=>{setEditTarget(null);setModalOpen(true);}}>＋ 新增</button>
            </div>
            <div className="search-wrap"><span className="search-icon">🔍</span><input className="search-input" value={search} onChange={e=>setSearch(e.target.value)} placeholder="搜尋資源..."/></div>
            <div className="tabs">
              {CATEGORIES.map(c=><button key={c} className={`tab ${category===c&&!showSaved?'active':''}`} onClick={()=>{setCategory(c);setShowSaved(false);}}>{c}</button>)}
              <div className="tab-spacer"/>
              <button className={`tab saved ${showSaved?'active':''}`} onClick={()=>setShowSaved(s=>!s)}>★ 收藏</button>
            </div>
          </div>
        </header>
      )}

      {/* 簡單頁首 for 其他頁 */}
      {page!=='home'&&(
        <div style={{background:'var(--header-bg)',padding:`max(28px,env(safe-area-inset-top)) 20px 16px`,position:'sticky',top:0,zIndex:50}}>
          <div style={{color:'#F3EEFF',fontFamily:'var(--font-display)',fontSize:20,fontWeight:700}}>
            {page==='training'?'👑 百萬新人培訓系統':'💬 銷售話術演練'}
          </div>
        </div>
      )}

      {/* 內容 */}
      {page==='home'&&(
        <main className="main">
          <div className="tag-strip"><Chip label="全部" active={!activeTag} onClick={()=>setActiveTag("")}/>{TAGS.map(t=><Chip key={t} label={`#${t}`} active={activeTag===t} onClick={()=>setActiveTag(activeTag===t?"":t)}/>)}</div>
          <div className="count">顯示 {filtered.length} 個結果{search&&` · 「${search}」`}</div>
          {showCheckin&&<div style={{marginBottom:14}}><CheckinCard/></div>}
          {filtered.length>0?<div className="grid">{filtered.map(r=><Card key={r.id} r={r} onLike={handleLike} onSave={handleSave} onEdit={handleEdit}/>)}</div>:<div className="empty"><div className="empty-icon">🗂️</div><p>找不到符合的資源</p></div>}
        </main>
      )}
      {page==='training'&&<TrainingPage/>}
      {page==='practice'&&<PracticePage/>}

      {/* AI 浮動按鈕（只在 home 顯示）*/}
      {page==='home'&&<button className="ai-fab" onClick={()=>setAiOpen(o=>!o)}>{aiOpen?'×':'✨'}</button>}
      {page==='home'&&aiOpen&&<AIPanel onClose={()=>setAiOpen(false)}/>}

      {/* 底部導覽列 */}
      <nav className="bottom-nav">
        <button className={`nav-btn ${page==='home'?'active':''}`} onClick={()=>setPage('home')}><span className="nav-icon">🏠</span>資源庫</button>
        <button className={`nav-btn ${page==='training'?'active':''}`} onClick={()=>setPage('training')}><span className="nav-icon">📖</span>培訓系統</button>
        <button className={`nav-btn ${page==='practice'?'active':''}`} onClick={()=>setPage('practice')}><span className="nav-icon">🎯</span>話術演練</button>
      </nav>

      <Modal open={modalOpen} onClose={()=>{setModalOpen(false);setEditTarget(null);}} onSave={handleSaveResource} initial={editTarget}/>
      <Toast msg={toast}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
<script>if('serviceWorker'in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});}</script>
</body>
</html>
